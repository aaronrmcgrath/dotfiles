# prefix
set -g prefix C-b
bind C-b send-prefix

# sensible defaults
set -g mouse on
set -g history-limit 10000
set -sg escape-time 10
set -g focus-events on
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

# 256 color + true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# vi keys in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# pane nav (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reload
bind r source-file ~/.tmux.conf \; display "reloaded"

# ── Tokyo Night statusbar ──────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#1a1b26"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26]"

set -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7] #I:#W #[fg=#bb9af7,bg=#1a1b26]"

set -g status-right "#[fg=#414868,bg=#1a1b26]#[fg=#a9b1d6,bg=#414868] %H:%M #[fg=#7aa2f7,bg=#414868]#[fg=#1a1b26,bg=#7aa2f7,bold] #H "

set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#414868,fg=#c0caf5"
